server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    # Don't advertise the nginx version.
    server_tokens off;

    # Auth payloads are tiny; cap the body to blunt oversized-request abuse.
    client_max_body_size 1m;

    # Baseline security headers for API responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only pass through to PHP-FPM for scripts that actually exist; this
        # prevents arbitrary paths being interpreted as PHP.
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
